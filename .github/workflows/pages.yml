name: Publish School Route Atlas
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: school-route-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Import only verified public guide files
        env:
          PUBLIC_SOURCE: https://licence-conscious-villages-walks.trycloudflare.com/
        run: |
          python3 - <<'PY'
          import hashlib, os, urllib.request
          from pathlib import Path
          hashes = {
            'index.html': 'ec2411c42ac04149f3c852bc42cd9310e8ce50b06698ce6db34a9ba4c9482244',
            'styles.css': '6f2dd8bb62c1c5df965d779415bd9607b78eac085e593e2c94b7197e440eaa06',
            'app.js': 'fa0dc53d6e97d535122d309248bbf1a5d106489409694bfcf7cdae327be40c65',
            'content.json': '2d799c20cb340a287b443aa5202c354872bc397d153fed9a079ed045d6431ab0',
            'additional-universities.json': '5b8e5cef69d61a4b861f6e468a7c3c09394cfac84afa63c609beae55b4e489ee'
          }
          Path('site').mkdir(exist_ok=True)
          for name, expected in hashes.items():
            target = Path('site') / name
            data = target.read_bytes() if target.exists() else urllib.request.urlopen(os.environ['PUBLIC_SOURCE'] + name, timeout=60).read()
            if hashlib.sha256(data).hexdigest() != expected:
              raise RuntimeError('Public file hash mismatch: ' + name)
            target.write_bytes(data)
            print('Verified', name, len(data))
          PY
      - name: Preserve the imported five files for future builds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site
          if ! git diff --cached --quiet; then
            git commit -m 'Save verified public School Route Atlas files'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy static guide
        id: deployment
        uses: actions/deploy-pages@v4
